  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile.prod
    container_name: nginx
    expose:
      - "80"
    ports:
      - "80:80"
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/ssl
    networks:
      - siga-fcen

networks:
  siga-fcen:
    external: true
services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nextjs-dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/src/app
      - /src/app/node_modules
    env_file:
      - ./.env
    networks:
      - siga-fcen
    command: ["npm", "run", "dev"]

  nginx:
    image: nginx:latest
    container_name: nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      - nextjs
    networks:
      - siga-fcen

networks:
  siga-fcen:
    external: true
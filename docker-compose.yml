services:
  nextjs:
    build: .
    container_name: nextjs

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - nextjs

  openssl:
    image: frapsoft/openssl
    container_name: openssl
    volumes:
      - ./certs:/certs
      - ./openssl.cnf:/etc/ssl/openssl.cnf
    entrypoint: >
      sh -c "
      openssl req -new -newkey rsa:2048 -nodes -keyout /certs/siga.udea.edu.co.key -out /certs/siga.udea.edu.co.csr -config /etc/ssl/openssl.cnf
      "
